name: Build KronTerm iOS

on:
  push:
    branches:
      - feat/ios-kronterm-local-shell
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build KronosChamber web UI
        run: bun run build:web

      - name: Bundle KronosChamber into iOS app
        run: node scripts/prepare-ios-kronoschamber.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: packages/ios
        run: xcodegen generate

      - name: Force GitHub package submodules over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Build unsigned device app
        working-directory: packages/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KronTermMobile.xcodeproj \
            -scheme KronTermMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log

      - name: Package unsigned IPA
        working-directory: packages/ios
        run: |
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/KronTerm.app"
          test -d "$APP_PATH"
          rm -rf Payload KronTerm-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/KronTerm.app
          /usr/bin/zip -qry KronTerm-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KronTerm-iPhone-unsigned
          path: packages/ios/KronTerm-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KronTerm-iOS-build-log
          path: packages/ios/build.log
          if-no-files-found: ignore

  testflight:
    needs: build-ios
    if: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 != '' && secrets.APPLE_DISTRIBUTION_CERT_PASSWORD != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build KronosChamber web UI
        run: bun run build:web

      - name: Bundle KronosChamber into iOS app
        run: node scripts/prepare-ios-kronoschamber.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: packages/ios
        run: xcodegen generate

      - name: Force GitHub package submodules over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Apple signing credentials
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kronterm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/KronTerm.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/KronTerm.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/KronTerm.mobileprovision"

      - name: Prepare App Store Connect API key
        env:
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Archive signed KronTerm
        working-directory: packages/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KronTermMobile.xcodeproj \
            -scheme KronTermMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/KronTerm.xcarchive" \
            archive | tee signed-build.log

      - name: Create App Store export options
        working-directory: packages/ios
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        working-directory: packages/ios
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/KronTerm.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"

      - name: Upload KronTerm to TestFlight
        working-directory: packages/ios
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KronTerm-iPhone-TestFlight-signed
          path: packages/ios/build/export/*.ipa
          if-no-files-found: error
