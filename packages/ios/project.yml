name: KronTermMobile
options:
  bundleIdPrefix: ai.kronterm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.6.0
  ios_system:
    url: https://github.com/holzschu/ios_system.git
    from: 3.0.4
targets:
  KronTermMobile:
    type: application
    platform: iOS
    sources:
      - path: KronTermMobile/Sources
      - path: KronTermMobile/Resources
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: ios_system
        product: ios_system
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.kronterm.mobile
        PRODUCT_NAME: KronTerm
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KronTerm
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "KronTerm can connect to local development services when you choose to use them."
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      testTargets: []
